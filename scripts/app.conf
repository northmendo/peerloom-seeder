# App-specific configuration for scripts/release.sh (the non-phone profile of
# /home/tim/peerloomllc/RELEASE-PIPELINE.md).

# -- Identity -----------------------------------------------------------------
APP_NAME="PeerLoom Seeder"                   # Display name (logs, release title, Nostr)
APP_ID=peerloom-seeder                       # Umbrel and StartOS id

# -- Where the downloads go ----------------------------------------------------
# One public repo for code and releases, as the other apps (Tim, 2026-10-13).
# The installed seeders check its releases for updates.
RELEASES_REPO=peerloomllc/peerloom-seeder

# -- Mac Mini build host -------------------------------------------------------
MAC_MINI_HOST=Tims-Mac-mini.local

# -- Seeder stores ---------------------------------------------------------------
UMBREL_IMAGE=ghcr.io/peerloomllc/peerloom-seeder

# -- Nostr announcement --------------------------------------------------------
APP_TAGLINE="Keeps your PeerLoom apps in sync while your phones sleep. One seeder for every PeerLoom app, on a computer or home server you own. It stores only scrambled data it cannot read."
APP_WEBSITE=https://peerloomllc.com/seeder/
NOSTR_HASHTAGS="#PeerLoom #Nostr #P2P #privacy #selfhosted #Umbrel #StartOS"
